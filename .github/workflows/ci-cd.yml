name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server - lint, test, coverage
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        run: |
          echo "### Server test coverage" >> $GITHUB_STEP_SUMMARY
          node -e "const s=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('- '+k+': '+s[k].pct+'%')" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: coverage-report, path: server/coverage }

  client:
    name: Client - lint, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env: { VITE_API_URL: "https://example.com/api" }

  deploy:
    name: Deploy (main only)
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Render
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL secret not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
      - name: Deploy frontend to Vercel
        # Optional: Vercel's Git integration already deploys main automatically.
        env: { HOOK: "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "Using Vercel Git integration (no hook set)"; exit 0; fi
          curl -fsS -X POST "$HOOK"
